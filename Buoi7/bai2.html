<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bài 2 · Component sản phẩm</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="components/TheSanPham.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 18px;
      background: #f3f6fb;
      color: #172033;
      font-family: Arial, sans-serif;
    }
    .app { max-width: 1100px; margin: auto; }
    .back { color: #2457bd; text-decoration: none; }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 18px;
      margin-top: 22px;
    }
    .product-card {
      overflow: hidden;
      border: 1px solid #e0e6f0;
      border-radius: 14px;
      background: white;
      box-shadow: 0 5px 18px #1720330b;
    }
    .product-image { display: block; width: 100%; height: 190px; object-fit: cover; background: #e8eef9; }
    .product-content { padding: 18px; }
    .product-heading { display: flex; align-items: start; justify-content: space-between; gap: 10px; }
    h2 { margin: 0; font-size: 19px; }
    .category { margin: 6px 0 0; color: #69758a; font-size: 13px; }
    .price { margin: 12px 0 6px; color: #2457bd; font-size: 20px; font-weight: bold; }
    .stock, .description { color: #596579; line-height: 1.5; }
    .badge { display: inline-block; flex: 0 0 auto; padding: 5px 9px; border-radius: 20px; font-size: 12px; }
    .in-stock { background: #e7f7ed; color: #18743a; }
    .out-of-stock { background: #ffeded; color: #b42323; }
    button { min-height: 38px; padding: 8px 12px; border: 0; border-radius: 8px; font: inherit; cursor: pointer; }
    .secondary-button { background: #eff4ff; color: #2457bd; }
    .buy-button { width: 100%; margin-top: 14px; background: #2457bd; color: white; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    .notice { margin-top: 20px; color: #18743a; }
  </style>
</head>
<body>
  <main id="app" class="app">
    <a class="back" href="index.html">← Danh sách bài tập</a>
    <h1>Danh mục sản phẩm</h1>

    <section class="products" aria-label="Danh sách sản phẩm">
      <the-san-pham
        v-for="product in products"
        :key="product.id"
        :ten="product.name"
        :gia="product.price"
        :danh-muc="product.category"
        :anh="product.image"
        :mo-ta="product.description"
        :so-luong-ton="product.stock"
        @mua="buyProduct(product)"
      ></the-san-pham>
    </section>
    <p v-if="purchaseNotice" class="notice" role="status">{{ purchaseNotice }}</p>
  </main>

  <script>
    const app = Vue.createApp({
      data() {
        return {
          purchaseNotice: '',
          products: [
            {
              id: 1,
              name: 'Tai nghe Bluetooth',
              price: 450000,
              category: 'Điện tử',
              image: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80',
              description: 'Tai nghe Bluetooth gọn nhẹ, kết nối không dây tiện lợi cho học tập và làm việc.',
              stock: 12
            },
            {
              id: 2,
              name: 'Chuột không dây',
              price: 250000,
              category: 'Điện tử',
              image: 'https://images.unsplash.com/photo-1527814050087-3793815479db?auto=format&fit=crop&w=800&q=80',
              description: 'Chuột không dây nhỏ gọn, dễ sử dụng với máy tính ở nhà hoặc văn phòng.',
              stock: 0
            },
            {
              id: 3,
              name: 'Bàn phím cơ',
              price: 890000,
              category: 'Điện tử',
              image: 'https://images.unsplash.com/photo-1587829741301-dc798b83add3?auto=format&fit=crop&w=800&q=80',
              description: 'Bàn phím cơ cho cảm giác gõ rõ ràng, phù hợp khi học tập và làm việc.',
              stock: 7
            },
            {
              id: 4,
              name: 'Bút bi xanh',
              price: 5000,
              category: 'Văn phòng phẩm',
              image: 'https://images.unsplash.com/photo-1455390582262-044cdead277a?auto=format&fit=crop&w=800&q=80',
              description: 'Bút bi mực xanh viết êm, thích hợp ghi chép hằng ngày.',
              stock: 120
            },
            {
              id: 5,
              name: 'Sổ tay A5',
              price: 35000,
              category: 'Văn phòng phẩm',
              image: 'https://images.unsplash.com/photo-1531346878377-a5be20888e57?auto=format&fit=crop&w=800&q=80',
              description: 'Sổ tay khổ A5 nhỏ gọn để ghi chú, lên kế hoạch và mang theo.',
              stock: 24
            },
            {
              id: 6,
              name: 'Bình giữ nhiệt',
              price: 180000,
              category: 'Gia dụng',
              image: 'https://images.unsplash.com/photo-1602143407151-7111542de6e8?auto=format&fit=crop&w=800&q=80',
              description: 'Bình giữ nhiệt tiện dụng để mang theo nước khi đi học hoặc đi làm.',
              stock: 0
            }
          ]
        };
      },

      methods: {
        buyProduct(product) {
          if (product.stock <= 0) return;
          product.stock -= 1;
          this.purchaseNotice = `Đã thêm "${product.name}" vào giỏ hàng.`;
        }
      }
    });

    app.component('the-san-pham', window.TheSanPham);
    app.mount('#app');
  </script>
</body>
</html>
